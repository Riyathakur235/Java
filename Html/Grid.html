<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    #grid{
        border: 2px solid;
        height: 500px;
        display: grid;
        grid-template-columns: 200px 300px ;
        grid-template-rows: 200px 200px;
    }
    #grid div{
        border: 2px solid;
    }
    #one{
        background-color: red;
        
    }
    #two{
        background-color: aqua;
    }
    #three{
        background-color: blueviolet;
        
    }
    #four{
        background-color: brown;
    }
    </style>
</head>
<body>
    <div id="grid">
        <div id="one">1</div>
        <div id="two">2</div>
        <div id="three">3</div>
        <div id ="four">4</div>
        <div id="five">5</div>
        <div id="six">6</div>
        <div></div>
    </div>
</body>
</html>
