<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            border: 2px solid red;
           height: 400px;
           width: 960px;
        }

        .on{
            height: 80px;
            width:80px;
            transition: 3s;
        }
        #parent:hover .on{
            margin-left: 881px;
            /* border-radius: 50%; */
            transform: rotate(150deg);
            transform: scale(2,3);
        }
        #one{
            background-color: yellow;
           transition-timing-function: ease-in;
        }
        #two{
            background-color: aqua;
            transition-timing-function: ease-out;
        }
        #three{
            background-color: blueviolet;
            transition-timing-function: ease-in-out;
        }
        #four{
            background-color: plum;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="one" class="on">1</div>
        <div id="two"class="on">2</div>
        <div id="three"class="on">3</div>
        <div id="four" class="on">4</div>
    </div>
</body>
</html>
