<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #image{
            border:2px solid green;
            height: 500px;
            display: grid;
            grid-template-columns: 200px 300px;
            gap:10px;

        }
        .class{
            border: 2px solid gray ;
            overflow: hidden;
            transition: 3s;
        }
        .class img:hover{
           transform: scale(2);
           
        } 
         #one{
          background-color: aqua;
          overflow: hidden;
        } 
       
    </style>
</head>
<body>
    <div id="image">
        <div class="class" id="one">1</div>
      <div class="class" id="two">2</div>
       <div class="class" id="three">3</div>
        <div class="class" id="four">4</div>
      <div class="class" id="five">5</div>
      <div class="class" id="six">6</div>
    </div>
</body>
</html>
